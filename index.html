<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>มาง้อนะ ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #4a4a4a;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .heart-icon {
            font-size: 80px;
            animation: pulse 1.5s infinite;
        }

        h1 {
            color: #ff6b81;
            margin: 20px 0 10px 0;
            font-size: 28px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #666;
        }

        .btn {
            background-color: #ff6b81;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 129, 0.4);
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: #ff4757;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* ซ่อนข้อความสเปเชียลไว้ก่อน */
        #secret-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #ffeaa7;
            border-radius: 10px;
            color: #d63031;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart-icon">💖</div>
        <h1>ให้อภัยแล้วนะ!</h1>
        <p>
            ไม่ร้องแล้วน้าาา หนูไม่ได้งอนแล้ว<br>
            ครั้งนี้ให้อภัย แต่ครั้งหน้าต้องพาไปกินของอร่อยๆ เป็นการไถ่โทษด้วยนะ! 🥺✨
        </p>
        
        <button class="btn" onclick="showLove()">กดเพื่อรับความรัก</button>

        <div id="secret-message">
            กอดๆ นะคนเก่ง หายงอน 100% แล้ว! 🥰
        </div>
    </div>

    <script>
        function showLove() {
            // แสดงข้อความลับ
            var message = document.getElementById("secret-message");
            message.style.display = "block";

            // เปลี่ยนข้อความปุ่ม
            var btn = document.querySelector('.btn');
            btn.innerText = "รักเธอนะ ❤️";
            
            // เอฟเฟกต์หัวใจเด้ง
            document.querySelector('.heart-icon').innerText = "🥰";
        }
    </script>

</body>
</html>
